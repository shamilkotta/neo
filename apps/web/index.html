<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cut, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141414"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg transform='rotate(-8 20 20)'%3E%3Crect x='2' y='2' width='36' height='36' rx='13' fill='%2394b8f0'/%3E%3Cellipse cx='14' cy='19' rx='3.4' ry='4.6' fill='%230a0a0c'/%3E%3Cellipse cx='26' cy='19' rx='3.4' ry='4.6' fill='%230a0a0c'/%3E%3Ccircle cx='15.2' cy='17.2' r='1.2' fill='%23fff'/%3E%3Ccircle cx='27.2' cy='17.2' r='1.2' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Neo</title>
    <script>
      try {
        const t = localStorage.getItem("neo.theme");
        const dark =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
